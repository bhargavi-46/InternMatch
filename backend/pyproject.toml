[project]
name = "internmatch"
version = "0.1.0"
description = "AI internship matcher for students: semantic search, personalised ranking and an LLM agent over a live jobs index."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "fastembed>=0.9.1",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "langchain-groq>=1.2.0",
    "langgraph>=1.2.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
]
